# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy to GitHub Pages

on:
  push:
    branches: [beta, main]
  workflow_dispatch:

# Минимальные права на уровне workflow; более широкие выдаются точечно
# тем job'ам, которым они действительно нужны (publish, deploy).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # --- Какие версии пересобирать в этом прогоне ---
  # Пуш в ветку пересобирает только её версию; вторая берётся из последней
  # зелёной сборки (job publish). Ручной запуск, первый пуш в ветку или
  # отсутствие нужного артефакта (бустрап) — строим обе версии.
  changes:
    runs-on: ubuntu-latest
    # Список артефактов прошлых прогонов читаем через gh api
    permissions:
      contents: read
      actions: read
    outputs:
      stable: ${{ steps.decide.outputs.stable }}
      beta: ${{ steps.decide.outputs.beta }}
    steps:
      - name: Какие версии нужно пересобрать?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_exists() {
            local id
            id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=$1&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)][0].id' 2>/dev/null || true)
            [ -n "$id" ] && [ "$id" != "null" ]
          }

          STABLE=true
          BETA=true
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "$ZERO" ]; then
            : # Ручной запуск или первый пуш в ветку — бустрап, строим обе версии
          elif [ "${{ github.ref_name }}" = "main" ]; then
            BETA=false
            artifact_exists site-beta || BETA=true
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            STABLE=false
            artifact_exists site-stable || STABLE=true
          else
            echo "::warning::Неожиданная ветка «${{ github.ref_name }}» — для надёжности строим обе версии."
          fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"

  # --- Стабильная версия (main) → корень сайта ---
  build-stable:
    needs: changes
    if: needs.changes.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main-src/package-lock.json
      - name: Установка зависимостей (main)
        working-directory: main-src
        run: npm ci
      - name: Линт (main)
        working-directory: main-src
        run: npm run lint:check --if-present
      - name: Тесты (main)
        working-directory: main-src
        run: npm run test --if-present
      - name: Проверка типов (main)
        working-directory: main-src
        run: npm run typecheck --if-present
      - name: Сборка стабильной версии (main)
        working-directory: main-src
        env:
          GH_PAGES_BASE: /SharoBoy/
          VITE_BUILD_VERSION: ${{ github.run_number }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Загрузка артефакта стабильной версии
        uses: actions/upload-artifact@v4
        with:
          name: site-stable
          path: main-src/dist
      # AD-036: имя кэша в sw.js обязано содержать номер сборки. Незаменённый
      # плейсхолдер вернул бы «залипание» на прошлом билде — ловим это здесь,
      # а не в проде.
      - name: Проверка версии сервис-воркера (main)
        working-directory: main-src
        run: |
          set -euo pipefail
          SW=dist/sw.js
          grep -q "__CACHE_" "$SW" && { echo "::error::В $SW остались плейсхолдеры"; exit 1; }
          grep -q "sharoboy-${{ github.run_number }}" "$SW" || {
            echo "::error::В $SW нет версии сборки ${{ github.run_number }}"; exit 1; }
          echo "sw.js: $(grep 'const CACHE_VERSION' "$SW")"

  # --- Бета-версия (beta) → подкаталог /beta/ ---
  build-beta:
    needs: changes
    if: needs.changes.outputs.beta == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta-src/package-lock.json
      - name: Установка зависимостей (beta)
        working-directory: beta-src
        run: npm ci
      - name: Линт (beta)
        working-directory: beta-src
        run: npm run lint:check --if-present
      - name: Тесты (beta)
        working-directory: beta-src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vitest run --no-file-parallelism
      - name: Проверка типов (beta)
        working-directory: beta-src
        run: npm run typecheck --if-present
      - name: Сборка бета-версии (beta)
        working-directory: beta-src
        env:
          GH_PAGES_BASE: /SharoBoy/beta/
          VITE_BUILD_VERSION: ${{ github.run_number }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Загрузка артефакта бета-версии
        uses: actions/upload-artifact@v4
        with:
          name: site-beta
          path: beta-src/dist
      # AD-036: у беты имя кэша обязано иметь префикс scope, иначе она делит
      # кэш с корневой сборкой и они удаляют кэши друг друга при активации.
      - name: Проверка версии сервис-воркера (beta)
        working-directory: beta-src
        run: |
          set -euo pipefail
          SW=dist/sw.js
          grep -q "__CACHE_" "$SW" && { echo "::error::В $SW остались плейсхолдеры"; exit 1; }
          grep -q "sharoboy-beta-${{ github.run_number }}" "$SW" || {
            echo "::error::В $SW нет beta-версии сборки ${{ github.run_number }}"; exit 1; }
          echo "sw.js: $(grep 'const CACHE_VERSION' "$SW")"

  # --- Склейка сайта и подготовка артефакта Pages ---
  # Деплой Pages атомарен: артефакт заменяет сайт ЦЕЛИКОМ, поэтому в site/
  # всегда кладутся ОБЕ версии. Свежие — из этого прогона; если сборка ветки
  # пропущена (пуш в другую ветку) или упала — берём её последнюю рабочую
  # сборку из прошлых прогонов. Так упавший main не блокирует бету (и
  # наоборот), а корень и /beta/ никогда не публикуются пустыми или битыми.
  publish:
    needs: [build-stable, build-beta]
    # Нужен хотя бы один успешно собранный артефакт этого прогона: остальную
    # версию в site/ подтянут шаги-фолбэки ниже (независимо от того, упала
    # вторая сборка или была пропущена).
    if: >-
      ${{
        always() && !cancelled() &&
        needs.build-stable.result != 'cancelled' && needs.build-beta.result != 'cancelled' &&
        (needs.build-stable.result == 'success' || needs.build-beta.result == 'success')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # КОРЕНЬ САЙТА. Строго обязателен: Pages-деплой заменяет сайт целиком,
      # поэтому без корня публикация унесла бы с собой стабильную версию.
      # Раньше этот шаг молча ничего не делал, когда build-stable был skipped:
      # site/ оставался без index.html, и публикация падала уже после успешной
      # сборки beta (инцидент сборки 360).
      - name: Свежая сборка main → корень сайта
        if: needs.build-stable.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: site-stable
          path: site
      - name: Фолбэк — последняя зелёная сборка main
        if: needs.build-stable.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=site-stable&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)][0].id' 2>/dev/null || true)
          if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
            # Зелёной сборки main ещё не было (сейчас деплоится только beta).
            # Это НЕ повод валить публикацию: корень просто остаётся прежним —
            # его сохранит шаг «Сохранение текущего корня сайта».
            echo "::warning::Сборки main нет — корень сайта сохраняем от прошлой публикации."
            echo "root_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Используем артефакт #$ART_ID последней зелёной сборки main."
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/site-stable.zip
          mkdir -p site
          unzip -q /tmp/site-stable.zip -d site
          echo "root_available=true" >> "$GITHUB_OUTPUT"
        id: root-fallback
      # Корень сайта не удалось взять из артефакта main (его ещё ни разу не
      # собирали). Pages публикует сайт АТОМАРНО, поэтому сохраняем корень из
      # уже опубликованной gh-pages: иначе beta-деплой затёр бы стабильную
      # версию файлами одной беты.
      - name: Сохранение текущего корня сайта
        if: needs.build-stable.result != 'success' && steps.root-fallback.outputs.root_available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone -q --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ../published-gh-pages
            mkdir -p site
            # Берём ВСЁ, кроме beta/ (её перезапишет свежая сборка ниже).
            (cd ../published-gh-pages && tar -cf - --exclude=./.git --exclude=./beta .) | tar -xf - -C site
            echo "Корень сайта сохранён из gh-pages."
          else
            echo "::warning::Ветки gh-pages ещё нет — корень сайта будет пустым (первая публикация)."
          fi
      # --- ФОЛБЭКИ ВЕРСИЙ ---
      # Каждая версия берётся из артефакта ТОЛЬКО текущего прогона. Раньше здесь
      # брался «последний не-протухший артефакт вообще», поэтому пустая или
      # полупустая сборка могла подменить опубликованную версию чужой
      # (инцидент сборки 360: в site/ не оказалось корня сайта).
      # Если артефакта этого прогона нет — версия остаётся в том виде, в каком
      # уже лежит в gh-pages: шаг сохранения ниже кладёт её обратно.
      - name: Свежая сборка beta → /beta/
        if: needs.build-beta.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: site-beta
          path: site/beta
      - name: Фолбэк — последняя зелёная сборка beta
        if: needs.build-beta.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=site-beta&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.id == $GITHUB_RUN_ID)][0].id" \
            2>/dev/null || true)
          if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
            echo "::warning::Свежей сборки beta в этом прогоне нет — /beta/ берём из опубликованной gh-pages."
            echo "beta_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Используем артефакт #$ART_ID сборки beta этого прогона."
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/site-beta.zip
          mkdir -p site/beta
          unzip -q /tmp/site-beta.zip -d site/beta
          echo "beta_available=true" >> "$GITHUB_OUTPUT"
        id: beta-fallback
      - name: Сохранение опубликованной /beta/
        if: needs.build-beta.result != 'success' && steps.beta-fallback.outputs.beta_available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone -q --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ../published-for-beta
            mkdir -p site/beta
            if [ -d ../published-for-beta/beta ]; then
              (cd ../published-for-beta/beta && tar -cf - .) | tar -xf - -C site/beta
              echo "Опубликованная /beta/ сохранена."
            else
              echo "::warning::В gh-pages нет /beta/ — версия будет отсутствовать."
            fi
          fi
      - name: Загрузка собранного сайта как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: site
      # Публикация в ветку gh-pages выполняется прямо здесь, внутри job publish.
      # Отдельный job «deploy» GitHub автоматически трактует как Pages-деплой и
      # блокирует его для ветки beta (environment github-pages разрешает деплой
      # только из main; см. protection rules). Ветку gh-pages GitHub Pages
      # разворачивает автоматически при каждом пуше — без environment вовсе.
      - name: Публикация в ветку gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd site

          # Страховка: без корневого index.html публикация навсегда лишила бы
          # сайт стабильной версии (Pages заменяет сайт целиком).
          if [ ! -f index.html ]; then
            echo "::error::В site/ нет index.html — публикация унесла бы корень сайта. Останавливаюсь."
            exit 1
          fi
          if [ ! -d beta ]; then
            echo "::warning::В site/ нет /beta/ — на сайте останется только стабильная версия."
          fi

          # Артефакты прошлых прогонов могли принести с собой .git (репозиторий
          # gh-pages целиком) — вычищаем, иначе git init создаст вложенный
          # репозиторий, и публикация уедет не туда.
          rm -rf .git

          # Ветка gh-pages уже существует? Если нет — публикуем в первый раз.
          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            # Ветка есть. Скачиваем её в отдельную папку для сравнения.
            git clone -q --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ../current-gh-pages
            # Сравниваем содержимое: если в gh-pages уже опубликован ровно этот
            # сайт (тот же коммит ветки beta), ничего пересобирать не нужно —
            # не создаём «мусорный» коммит и не триггерим лишний деплой.
            if diff -r --exclude=.git . ../current-gh-pages >/dev/null 2>&1; then
              echo "Сайт не изменился — пропускаем публикацию."
              exit 0
            fi
            echo "Сайт изменился — публикуем обновление."
          else
            echo "Ветки gh-pages ещё нет — публикуем в первый раз."
          fi

          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "deploy: ${{ github.ref_name }} @ ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
