name: Deploy to GitHub Pages

on:
  push:
    branches: [beta, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --- Стабильная версия (main) → корень сайта ---
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main-src/package-lock.json
      - name: Установка зависимостей (main)
        working-directory: main-src
        run: npm ci
      - name: Линт (main)
        working-directory: main-src
        run: npm run lint:check --if-present
      - name: Тесты (main)
        working-directory: main-src
        run: npm run test --if-present
      - name: Проверка типов (main)
        working-directory: main-src
        run: npm run typecheck --if-present
      - name: Сборка стабильной версии (main)
        working-directory: main-src
        env:
          GH_PAGES_BASE: /SharoBoy/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Перенос в корень сайта
        run: mv main-src/dist site

      # --- Бета-версия (beta) → подкаталог /beta/ ---
      - uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta-src/package-lock.json
      - name: Установка зависимостей (beta)
        working-directory: beta-src
        run: npm ci
      - name: Линт (beta)
        working-directory: beta-src
        run: npm run lint:check
      - name: Тесты (beta)
        working-directory: beta-src
        run: npm run test
      - name: Проверка типов (beta)
        working-directory: beta-src
        run: npm run typecheck
      - name: Сборка бета-версии (beta)
        working-directory: beta-src
        env:
          GH_PAGES_BASE: /SharoBoy/beta/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Перенос в подкаталог /beta/
        run: mv beta-src/dist site/beta

      - name: Настройка Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4

  # --- Edge Function «scores»: деплой при изменениях в supabase/functions ---
  # Сайт (Pages) функция не содержит, поэтому обычная пересборка её не обновляет.
  # Требуется секрет SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens);
  # без него job завершается с предупреждением, не ломая деплой сайта.
  # Ручной запуск (workflow_dispatch) деплоит функцию всегда — удобно, чтобы
  # один раз выкатить накопившиеся правки без изменения файлов.
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Изменилась ли функция в этом пуше?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/functions | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Установка Supabase CLI
        if: steps.changes.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Деплой Edge Function «scores»
        if: steps.changes.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Секрет SUPABASE_ACCESS_TOKEN не задан — деплой функции пропущен. Добавьте его: Settings → Secrets and variables → Actions."
            exit 0
          fi
          REF="$SUPABASE_PROJECT_REF"
          if [ -z "$REF" ]; then
            REF=$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml)
          fi
          if [ -z "$REF" ]; then
            echo "::error::Не удалось определить project-ref (supabase/config.toml). Задайте секрет SUPABASE_PROJECT_REF."
            exit 1
          fi
          echo "Деплой Edge Function «scores» в проект $REF…"
          supabase functions deploy scores --project-ref "$REF"

  # --- Миграции: применение к боевой базе при изменениях в supabase/migrations ---
  # Прямой хост db.<ref>.supabase.co — IPv6-only, поэтому подключаемся через
  # session-pooler (IPv4). Нужен секрет SUPABASE_DB_PASSWORD (Supabase →
  # Project Settings → Database → Database password; спецсимволы — в
  # URL-кодировке). Без секрета job завершается предупреждением. Ручной запуск
  # (workflow_dispatch) применяет миграции всегда.
  apply-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Есть ли новые миграции в этом пуше?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Установка Supabase CLI
        if: steps.changes.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Применение миграций к боевой базе
        if: steps.changes.outputs.changed == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Секрет SUPABASE_DB_PASSWORD не задан — миграции пропущены. Добавьте его: Settings → Secrets and variables → Actions."
            exit 0
          fi
          REF=$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml)
          HOST="${SUPABASE_POOLER_HOST:-aws-0-eu-central-1.pooler.supabase.com}"
          DB_URL="postgresql://postgres.${REF}:${SUPABASE_DB_PASSWORD}@${HOST}:5432/postgres"
          echo "Применение миграций к проекту $REF через session-pooler…"
          echo "y" | supabase db push --db-url "$DB_URL"
