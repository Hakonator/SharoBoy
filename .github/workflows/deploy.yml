# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy to GitHub Pages

on:
  push:
    branches: [beta, main]
  workflow_dispatch:

# Минимальные права на уровне workflow; более широкие выдаются точечно
# тем job'ам, которым они действительно нужны (publish, deploy).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # --- Какие версии пересобирать в этом прогоне ---
  # Пуш в ветку пересобирает только её версию; вторая берётся из последней
  # зелёной сборки (job publish). Ручной запуск, первый пуш в ветку или
  # отсутствие нужного артефакта (бустрап) — строим обе версии.
  changes:
    runs-on: ubuntu-latest
    # Список артефактов прошлых прогонов читаем через gh api
    permissions:
      contents: read
      actions: read
    outputs:
      stable: ${{ steps.decide.outputs.stable }}
      beta: ${{ steps.decide.outputs.beta }}
    steps:
      - name: Какие версии нужно пересобрать?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_exists() {
            local id
            id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=$1&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)][0].id' 2>/dev/null || true)
            [ -n "$id" ] && [ "$id" != "null" ]
          }

          STABLE=true
          BETA=true
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "$ZERO" ]; then
            : # Ручной запуск или первый пуш в ветку — бустрап, строим обе версии
          elif [ "${{ github.ref_name }}" = "main" ]; then
            BETA=false
            artifact_exists site-beta || BETA=true
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            STABLE=false
            artifact_exists site-stable || STABLE=true
          else
            echo "::warning::Неожиданная ветка «${{ github.ref_name }}» — для надёжности строим обе версии."
          fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"

  # --- Стабильная версия (main) → корень сайта ---
  build-stable:
    needs: changes
    if: needs.changes.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main-src/package-lock.json
      - name: Установка зависимостей (main)
        working-directory: main-src
        run: npm ci
      - name: Линт (main)
        working-directory: main-src
        run: npm run lint:check --if-present
      - name: Тесты (main)
        working-directory: main-src
        run: npm run test --if-present
      - name: Проверка типов (main)
        working-directory: main-src
        run: npm run typecheck --if-present
      - name: Сборка стабильной версии (main)
        working-directory: main-src
        env:
          GH_PAGES_BASE: /SharoBoy/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Загрузка артефакта стабильной версии
        uses: actions/upload-artifact@v4
        with:
          name: site-stable
          path: main-src/dist

  # --- Бета-версия (beta) → подкаталог /beta/ ---
  build-beta:
    needs: changes
    if: needs.changes.outputs.beta == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beta-src/package-lock.json
      - name: Установка зависимостей (beta)
        working-directory: beta-src
        run: npm ci
      - name: Линт (beta)
        working-directory: beta-src
        run: npm run lint:check --if-present
      - name: Тесты (beta)
        working-directory: beta-src
        run: npm run test --if-present
      - name: Проверка типов (beta)
        working-directory: beta-src
        run: npm run typecheck --if-present
      - name: Сборка бета-версии (beta)
        working-directory: beta-src
        env:
          GH_PAGES_BASE: /SharoBoy/beta/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Загрузка артефакта бета-версии
        uses: actions/upload-artifact@v4
        with:
          name: site-beta
          path: beta-src/dist

  # --- Склейка сайта и подготовка артефакта Pages ---
  # Деплой Pages атомарен: артефакт заменяет сайт ЦЕЛИКОМ, поэтому в site/
  # всегда кладутся ОБЕ версии. Свежие — из этого прогона; если сборка ветки
  # пропущена (пуш в другую ветку) или упала — берём её последнюю рабочую
  # сборку из прошлых прогонов. Так упавший main не блокирует бету (и
  # наоборот), а корень и /beta/ никогда не публикуются пустыми или битыми.
  publish:
    needs: [build-stable, build-beta]
    # Нужен хотя бы один успешно собранный артефакт этого прогона: остальную
    # версию в site/ подтянут шаги-фолбэки ниже (независимо от того, упала
    # вторая сборка или была пропущена).
    if: >-
      ${{
        always() && !cancelled() &&
        (needs.build-stable.result == 'success' || needs.build-beta.result == 'success')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Свежая сборка main → корень сайта
        if: needs.build-stable.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: site-stable
          path: site
      - name: Фолбэк — последняя зелёная сборка main
        if: needs.build-stable.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=site-stable&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)][0].id' 2>/dev/null || true)
          if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
            echo "::error::Сборка main в этом прогоне не выполнялась, а прошлой зелёной сборки нет — корень сайта нечем заполнить."
            exit 1
          fi
          echo "Используем артефакт #$ART_ID последней зелёной сборки main."
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/site-stable.zip
          mkdir -p site
          unzip -q /tmp/site-stable.zip -d site
      - name: Свежая сборка beta → /beta/
        if: needs.build-beta.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: site-beta
          path: site/beta
      - name: Фолбэк — последняя зелёная сборка beta
        if: needs.build-beta.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=site-beta&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)][0].id' 2>/dev/null || true)
          if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
            echo "::error::Сборка beta в этом прогоне не выполнялась, а прошлой зелёной сборки нет — /beta/ нечем заполнить."
            exit 1
          fi
          echo "Используем артефакт #$ART_ID последней зелёной сборки beta."
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/site-beta.zip
          mkdir -p site/beta
          unzip -q /tmp/site-beta.zip -d site/beta
      - name: Загрузка собранного сайта как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: site
      # Публикация в ветку gh-pages выполняется прямо здесь, внутри job publish.
      # Отдельный job «deploy» GitHub автоматически трактует как Pages-деплой и
      # блокирует его для ветки beta (environment github-pages разрешает деплой
      # только из main; см. protection rules). Ветку gh-pages GitHub Pages
      # разворачивает автоматически при каждом пуше — без environment вовсе.
      - name: Публикация в ветку gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd site

          # Ветка gh-pages уже существует? Если нет — публикуем в первый раз.
          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            # Ветка есть. Скачиваем её в отдельную папку для сравнения.
            git clone -q --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ../current-gh-pages
            # Сравниваем содержимое: если в gh-pages уже опубликован ровно этот
            # сайт (тот же коммит ветки beta), ничего пересобирать не нужно —
            # не создаём «мусорный» коммит и не триггерим лишний деплой.
            if diff -r --exclude=.git . ../current-gh-pages >/dev/null 2>&1; then
              echo "Сайт не изменился — пропускаем публикацию."
              exit 0
            fi
            echo "Сайт изменился — публикуем обновление."
          else
            echo "Ветки gh-pages ещё нет — публикуем в первый раз."
          fi

          git init -q
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "deploy: ${{ github.ref_name }} @ ${GITHUB_SHA:0:7}"
          git branch -M gh-pages
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
